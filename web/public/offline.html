<style>
  html,body{margin:0;height:100%;background:#061633;color:#e2e8f0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<body><main>
  <img src="/icons/icono-192.png" alt="">

  <p>Cuando vuelva la señal, toque «Reintentar».</p>
  <button onclick="location.reload()">Reintentar</button>
